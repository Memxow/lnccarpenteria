<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina non trovata - LNC Snc</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 550px;
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="card shadow-lg p-4 p-md-5 error-card mx-auto border-0">
            <div class="card-body">
                <!-- Icona stile carpenteria/lavori -->
                <div class="mb-4 text-warning">
                    <i class="fa-solid fa-triangle-exclamation fa-5x"></i>
                </div>
                
                <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
                <h2 class="h4 text-secondary mb-3">Pagina non trovata / Page Not Found</h2>
                
                <p class="text-muted mb-4">
                    La pagina che stai cercando potrebbe essere stata rimossa, rinominata o non è al momento disponibile.<br>
                    <small class="text-secondary">The page you are looking for might have been removed or is temporarily unavailable.</small>
                </p>

                <!-- Pulsanti di navigazione principale -->
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="index.html" class="btn btn-primary btn-lg px-4 me-sm-2">
                        <i class="fa-solid fa-house me-2"></i> Torna alla Home
                    </a>
                    <a href="en/index.html" class="btn btn-outline-secondary btn-lg px-4">
                        <i class="fa-solid fa-globe me-2"></i> English Home
                    </a>
                </div>
            </div>
            
            <div class="card-footer bg-transparent border-0 mt-3 text-muted small">
                &copy; LNC Snc di A. Africano & C.
            </div>
        </div>
    </div>

</body>
</html>
