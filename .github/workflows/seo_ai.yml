name: SEO AI Analyzer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: pip install google-generativeai

      - name: Esegui analisi SEO IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/seo_checker.py

      - name: Salva report su GitHub
        run: |
          git config --global user.name "SEO AI Bot"
          git config --global user.email "bot@github.com"
          git add SEO_RECOMMENDATIONS.md
          git commit -m "docs: aggiornato report SEO con IA Gemini" || exit 0
          git pull --rebase origin main
          git push
