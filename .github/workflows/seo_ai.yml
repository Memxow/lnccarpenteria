name: SEO AI Analyzer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Esegui analisi SEO IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/seo_checker.py

      - name: Salva e fai Push del Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: aggiornato report SEO con IA Gemini [skip ci]"
          file_pattern: "SEO_RECOMMENDATIONS.md"